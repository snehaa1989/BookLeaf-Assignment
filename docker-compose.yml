services:
  db:
    image: postgres:16-alpine
    container_name: bookleaf-db
    environment:
      POSTGRES_USER: bookleaf
      POSTGRES_PASSWORD: bookleaf_password
      POSTGRES_DB: bookleaf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookleaf"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookleaf-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bookleaf:bookleaf_password@db:5432/bookleaf
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-key}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ADMIN_EMAIL: admin@bookleaf.com
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      SEEDED_AUTHOR_PASSWORD: BookLeaf@123
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        python -c 'from app.database import engine; from app import models; from app.database import Base; Base.metadata.create_all(bind=engine)' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookleaf-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
